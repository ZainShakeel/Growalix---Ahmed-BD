<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Growalix">
  <defs>
    <linearGradient id="gRing" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0"   stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#6D8CF8"/>
      <stop offset="1"   stop-color="#3EC5F6"/>
    </linearGradient>
    <linearGradient id="gArrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3EC5F6"/>
    </linearGradient>
  </defs>

  <!-- The G: a thick ring left open at the upper right -->
  <path fill="url(#gRing)" d="
    M 61.99 12.70
    A 46 46 0 1 0 97.23 42.27
    L 79.37 48.77
    A 27 27 0 1 1 58.69 31.41
    Z"/>

  <!-- The G's crossbar -->
  <rect x="53" y="49" width="45" height="18" rx="3" fill="url(#gRing)"/>

  <!-- Growth arrow breaking out through the opening -->
  <path d="M38 77 L83 32" stroke="url(#gArrow)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <polygon points="99,15 99,49 65,15" fill="url(#gArrow)"/>
</svg>
